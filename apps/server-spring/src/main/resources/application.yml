server:
  port: ${PORT:4000}
  servlet:
    context-path: /api

spring:
  application:
    name: zhanx-dental-cloud
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:zhanx_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    serialization:
      write-dates-as-timestamps: false

# Cloud SaaS & Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:zhanx-dental-care-cloud-secret-key-super-secure-2026-very-long-token-key-32bytes}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  cloud:
    # Online Subscription & Tenant verification
    enforce-subscription: ${ENFORCE_SUBSCRIPTION:false}
    trial-days: 14
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
