version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhanx-cloud-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-zhanx_dental}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DentalCloud2026Secure!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/server-spring
      dockerfile: Dockerfile
    container_name: zhanx-spring-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-zhanx_dental}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-DentalCloud2026Secure!}
      JWT_SECRET: ${JWT_SECRET:-zhanx-dental-care-cloud-secret-key-super-secure-2026-very-long-token-key-32bytes}
      ENFORCE_SUBSCRIPTION: "true"
      CORS_ORIGINS: "*"
    ports:
      - "4000:4000"

volumes:
  postgres_data:
